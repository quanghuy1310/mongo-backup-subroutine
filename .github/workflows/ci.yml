name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
    - name: Install linters (optional)
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.59.0 || true
    - name: Build
      run: |
        go build ./...
    - name: Run tests
      run: |
        go test ./... -v
    - name: Run integration black-box tests (tests/)
      run: |
        # run tests that use the testtools helper
        go test ./tests -v -tags=testtools || true
    - name: Run linter
      run: |
        if [ -f $(which golangci-lint 2>/dev/null) ]; then golangci-lint run; else echo "golangci-lint not installed"; fi
